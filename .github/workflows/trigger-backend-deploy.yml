name: Trigger Backend Auto Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve dispatch readiness
        env:
          BACKEND_REPO_DISPATCH_TOKEN: ${{ secrets.BACKEND_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$BACKEND_REPO_DISPATCH_TOKEN" ]; then
            echo "DISPATCH_READY=false" >> "$GITHUB_ENV"
            echo "Skipping cross-repo dispatch: missing secret BACKEND_REPO_DISPATCH_TOKEN."
            echo "Create a PAT with access to Brian-code-123/A-Grade-Amendment-System and store it as this secret."
          else
            echo "DISPATCH_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Dispatch backend deployment workflow
        if: env.DISPATCH_READY == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BACKEND_REPO_DISPATCH_TOKEN }}
          repository: Brian-code-123/A-Grade-Amendment-System
          event-type: frontend-updated
          client-payload: |
            {
              "frontend_repository": "${{ github.repository }}",
              "frontend_ref": "${{ github.ref }}",
              "frontend_sha": "${{ github.sha }}"
            }

      - name: Dispatch skip notice
        if: env.DISPATCH_READY != 'true'
        run: |
          echo "Workflow completed without dispatch because BACKEND_REPO_DISPATCH_TOKEN is not configured."
